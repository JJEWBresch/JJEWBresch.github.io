<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330"><title>Randomized Krylov subspace: method schematic</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#006400"/></marker></defs><rect width="1000" height="330" fill="#f5f8f5"/><g font-family="Arial,sans-serif" fill="#184b28"><text x="40" y="48" font-size="25">Build a space. Randomize the search.</text><g fill="white" stroke="#94b79d" stroke-width="2"><rect x="40" y="100" width="130" height="80" rx="10"/><rect x="245" y="100" width="130" height="80" rx="10"/><rect x="450" y="100" width="130" height="80" rx="10"/></g><g font-size="30" text-anchor="middle"><text x="105" y="150">b</text><text x="310" y="150">Ab</text><text x="515" y="150">A²b</text></g><g stroke="#006400" stroke-width="2" marker-end="url(#arrow)"><path d="M185 140H230"/><path d="M390 140H435"/><path d="M595 140H640"/></g><text x="665" y="150" font-size="27">… → Kₖ(A,b)</text><rect x="40" y="225" width="920" height="70" rx="10" fill="#e1ece2"/><text x="65" y="268" font-size="23">Random coefficients → direction in Kₖ → minimize ‖Ax − b‖²</text></g></svg>